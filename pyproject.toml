[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-thermometer-daemon"
version = "0.1.0"
description = "Standalone Linux daemon that logs standard Bluetooth Health Thermometer Profile readings"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "health-thermometer-ble @ git+https://github.com/home-health-hub/health-thermometer-ble.git",
    "aiomqtt>=2.0.0,<3.0.0",
    "apprise>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/home-health-hub/health-thermometer-daemon"

[project.scripts]
health-thermometer-daemon = "health_thermometer_daemon.cli:main"
health-thermometer-report = "health_thermometer_daemon.report:main"
health-thermometer-prune = "health_thermometer_daemon.prune:main"
health-thermometer-alert-check = "health_thermometer_daemon.alerting:main"
health-thermometer-api = "health_thermometer_daemon.api:main"

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/health_thermometer_daemon"]

[tool.hatch.metadata]
allow-direct-references = true
