name: Bug report
description: Report a problem with health-thermometer-daemon
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Device
      description: Manufacturer and model of the thermometer (e.g. iHealth TS28B, Beurer FT95, or another Health Thermometer Profile device)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `health-thermometer-daemon --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Python version, and Bluetooth adapter/backend
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run with `--verbose` and paste relevant output.
      render: shell
